# Join the same private Docker network as Open WebUI; no host port published.
services:
  aruba-mail:
    build: .
    image: aruba-mail-mcp:local
    command: ["--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8000"]
    user: "${LOCAL_UID:?Set LOCAL_UID to your host uid}:${LOCAL_GID:?Set LOCAL_GID to your host gid}"
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:rw,noexec,nosuid,size=16m]
    environment:
      ARUBA_MAIL_DB_PATH: /data/followups.sqlite3
      ARUBA_MAIL_MCP_TOKEN_FILE: /run/secrets/mcp.token
      ARUBA_MAIL_ALLOWED_HOSTS: aruba-mail:8000
    volumes:
      - ./data:/data
      - ./accounts.local.json:/app/accounts.local.json:ro
      - ./mcp.token:/run/secrets/mcp.token:ro
    networks: [ai-local]
networks:
  ai-local:
    external: true
    name: "${ARUBA_MAIL_DOCKER_NETWORK:-ai-local}"
